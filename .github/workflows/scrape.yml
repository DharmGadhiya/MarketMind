name: Scheduled NSE Scraper

on:
  schedule:
    # Runs every 24 hours (at midnight UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas curl_cffi

    - name: Run IPO Scraper
      env:
        RUN_ONCE: "true"
      run: |
        python "backend/Logic Files/ipo_listing.py"

    - name: Run Corporate Announcements Scraper
      env:
        RUN_ONCE: "true"
      run: |
        python "backend/Logic Files/corporate_announcements.py"

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated NSE Data Scrape Update [skip ci]"
        file_pattern: "backend/Logic Files/*.csv"
